<title>Sarah Chic – Mode femme</title>

<meta name="description" content="Sarah Chic, vêtements pour femme à Tizi Ouzou. Livraison et paiement à la livraison.">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FDF6ED;--surface:#fff;--ink:#2B1621;--mute:#7A6670;--line:#E6D8DB;--accent:#C9A06A;--accent-ink:#2B1621;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1C0F16;--surface:#28161F;--ink:#F7EDEF;--mute:#C2A9B2;--line:#4A2D3A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1C0F16;--surface:#28161F;--ink:#F7EDEF;--mute:#C2A9B2;--line:#4A2D3A;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;max-width:1100px;margin:auto}
.logo{font-weight:800;font-size:1.3rem;letter-spacing:-.02em}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.cartbtn{background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:8px 16px;font-weight:600}
.hero{max-width:1100px;margin:auto;padding:40px 20px 24px}
.hero h1{font-size:clamp(2.4rem,9vw,5.2rem);line-height:.98;letter-spacing:-.04em;font-weight:800;margin:0 0 16px;max-width:12ch}
.hero p{color:var(--mute);max-width:44ch;margin:0}
.filters{max-width:1100px;margin:auto;padding:12px 20px;display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{max-width:1100px;margin:auto;padding:8px 20px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.card{display:flex;flex-direction:column}
.pic{aspect-ratio:4/5;border-radius:4px;display:grid;place-items:center}
.pic svg{width:62%;height:auto}
.card h3{margin:10px 0 0;font-size:1rem}
.card .row{display:flex;justify-content:space-between;color:var(--mute);font-size:.95rem}
.sizes{display:flex;gap:6px;margin:8px 0}
.sizes button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:4px 0;font-size:.85rem}
.sizes button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.add{background:var(--accent);color:var(--accent-ink);border:0;border-radius:4px;padding:10px;font-weight:600}
aside{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);background:var(--surface);border-left:1px solid var(--line);padding:calc(16px + env(safe-area-inset-top,0px)) 20px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s;z-index:20}
aside.open{transform:none}
aside header{padding:0 0 12px}
.items{flex:1;overflow:auto}
.line{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.line small{color:var(--mute);display:block}
.line button{border:0;background:none;color:var(--mute);text-decoration:underline}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:1.2rem;padding:12px 0}
.pay{background:var(--ink);color:var(--bg);border:0;border-radius:4px;padding:12px;font-weight:600}
.empty{color:var(--mute);padding:20px 0}
footer{text-align:center;color:var(--mute);font-size:.85rem;padding:24px 20px 40px}
.fld{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:4px;padding:10px;margin:0 0 8px;font:inherit;font-size:16px}
.wa{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;background:#25D366;color:#fff;text-decoration:none;font-weight:600;padding:12px 18px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
footer a{color:inherit}
@media (prefers-reduced-motion:reduce){aside{transition:none}}
</style>
